<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - FlashCart Docs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Hind Siliguri', 'Inter', sans-serif;
      background: #F8FAF8;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 420px;
      padding: 40px 28px;
      background: #FFF;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(27,94,32,0.1);
    }
    h1 { font-size: 20px; color: #1B5E20; margin-bottom: 12px; }
    p { font-size: 14px; color: #616161; line-height: 1.7; margin-bottom: 20px; }
    button {
      padding: 10px 28px;
      background: #1B5E20;
      color: #FFF;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: #2E7D32; }
    .footer { margin-top: 24px; font-size: 11px; color: #BDBDBD; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Documentation Offline</h1>
    <p>You need an internet connection to browse the documentation. Please check your connection and try again.</p>
    <p>ডকুমেন্টেশন ব্রাউজ করতে ইন্টারনেট সংযোগ প্রয়োজন।</p>
    <button onclick="window.location.reload()">Try Again</button>
    <div class="footer">FlashCart Docs - Powered by BSDC</div>
  </div>
</body>
</html>
